name: Automated Android Release

on:
  push:
    tags:
      - 'v*' # Trigger ONLY when pushing git tags starting with 'v' (e.g. v0.5.0, v1.0.0)

permissions:
  contents: write # CRITICAL: Gives GITHUB_TOKEN write permissions to create releases & upload assets

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build Android Release APKs (Universal & Split ABIs)
      - name: Build Release APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      # 6. Extract Tag Name & Prepare Named APK Assets
      - name: Prepare APK Asset Names
        id: tag_name
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk finoteku-${TAG}-arm64-v8a.apk || true
          cp app-armeabi-v7a-release.apk finoteku-${TAG}-armeabi-v7a.apk || true
          cp app-x86_64-release.apk finoteku-${TAG}-x86_64.apk || true
          cp app-release.apk finoteku-${TAG}-universal.apk || true
          cp app-release.apk finoteku.apk || true

      # 7. Create GitHub Release & Upload All APK Assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: Finoteku Release ${{ steps.tag_name.outputs.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/finoteku-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
