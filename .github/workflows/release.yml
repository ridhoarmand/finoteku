name: Automated Android Release

# Release on demand, never on a plain push:
# - Actions → "Automated Android Release" → Run workflow (or `gh workflow run release.yml -f bump=patch`):
#   bumps `version:` in pubspec.yaml (name and build number), commits it to master, tags vX.Y.Z.
#   bump=none releases the current version (tags it if needed).
# - Or push a tag vX.Y.Z whose X.Y.Z equals `version:` in pubspec.yaml.
# Every check below fails the job instead of shipping a broken or unsigned APK.
# Steps and secrets are documented in CLAUDE.md ("Release").
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to raise (the build number always goes up)'
        type: choice
        options: [patch, minor, major, none]
        default: patch
      notes:
        description: 'Catatan rilis untuk pengguna, poin dipisah ";" (kosong = otomatis dari commit feat/fix)'
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # SHA-256 of the release certificate (~/.finoteku-keys/finoteku-release.jks, alias finoteku).
  # Every release must carry it, otherwise it cannot be installed over the previous one.
  RELEASE_CERT_SHA256: 20eac7cd856fbadae61e22bd44064b7fadcc69d55356967e720851df059e29bf

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}
          fetch-depth: 0

      # Only the working copy changes here. The version is committed and tagged after the
      # APKs are built and checked (step "Commit version and tag"), so a failed run uses no number.
      - name: Set release version (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          PUB=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/\r//')
          NAME=${PUB%+*}; BUILD=${PUB#*+}
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          case "$BUMP" in
            major) NAME="$((MAJOR + 1)).0.0" ;;
            minor) NAME="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NAME="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          [ "$BUMP" = none ] || sed -i "s/^version:.*/version: $NAME+$((BUILD + 1))/" pubspec.yaml
          if git rev-parse -q --verify "refs/tags/v$NAME" >/dev/null \
             && { [ "$BUMP" != none ] || [ "$(git rev-list -n1 "v$NAME")" != "$(git rev-parse HEAD)" ]; }; then
            echo "::error::Tag v$NAME already exists"; exit 1
          fi
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
          echo "Will release $NAME"

      - name: Check version, tag and secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for s in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 \
                   ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is missing"; exit 1; }
          done
          TAG=${RELEASE_TAG:-${{ github.ref_name }}}
          PUB=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/\r//')
          NAME=${PUB%+*}; BUILD=${PUB#*+}
          [ "v$NAME" = "$TAG" ] || { echo "::error::Tag $TAG does not match pubspec version $NAME"; exit 1; }
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREV" ]; then
            PREV_PUB=$(git show "$PREV:pubspec.yaml" | grep -m1 '^version:' | sed 's/version:[[:space:]]*//; s/\r//')
            PREV_NAME=${PREV_PUB%+*}; PREV_BUILD=${PREV_PUB#*+}
            [ "$(printf '%s\n%s\n' "$PREV_NAME" "$NAME" | sort -V | tail -1)" = "$NAME" ] && [ "$NAME" != "$PREV_NAME" ] \
              || { echo "::error::Version $NAME must be higher than $PREV_NAME ($PREV)"; exit 1; }
            [ "$BUILD" -gt "$PREV_BUILD" ] || { echo "::error::Build number $BUILD must be higher than $PREV_BUILD ($PREV)"; exit 1; }
          fi
          echo "Releasing $NAME+$BUILD (previous: ${PREV:-none})"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # AGP 9 lint calls Java 21 APIs (List.removeLast) and crashes on 17
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # same Flutter as development (~/Tools/flutter); android/ is on Gradle 9.5 + AGP 9.3 for it
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # The app reads Supabase credentials at compile time (--dart-define-from-file).
      - name: Create .env and keystore from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --dart-define-from-file=.env
          flutter build apk --release --split-per-abi --dart-define-from-file=.env

      - name: Verify signature and baked-in config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in build/app/outputs/flutter-apk/app-*release.apk; do
            CERT=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            [ "$CERT" = "$RELEASE_CERT_SHA256" ] || { echo "::error::$apk signed with $CERT, expected release cert"; exit 1; }
          done
          unzip -p build/app/outputs/flutter-apk/app-arm64-v8a-release.apk lib/arm64-v8a/libapp.so | grep -qaF "$SUPABASE_URL" \
            || { echo "::error::Supabase URL is not compiled into the APK"; exit 1; }
          echo "All APKs carry the release certificate and the Supabase config."

      - name: Prepare APK Asset Names
        id: tag_name
        run: |
          TAG=${RELEASE_TAG:-${{ github.ref_name }}}
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk finoteku-${TAG}-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk finoteku-${TAG}-armeabi-v7a.apk
          cp app-x86_64-release.apk finoteku-${TAG}-x86_64.apk
          cp app-release.apk finoteku-${TAG}-universal.apk

      # Reached only when the build and every check passed. The push to master fails, and
      # nothing is released, if master moved during the build: just run the release again.
      # GITHUB_TOKEN pushes start no other workflow.
      - name: Commit version and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- pubspec.yaml; then
            git commit -m "chore: rilis $RELEASE_TAG" -- pubspec.yaml
            git push origin HEAD:master
          fi
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag -a "$RELEASE_TAG" -m "Finoteku $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      # The body is what the update dialog on the phone shows, as plain text: a short list of
      # what changed for the user, not a link to a diff. Given notes win; otherwise the
      # feat/fix commit subjects since the previous release.
      - name: Write release notes
        env:
          NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.tag_name.outputs.TAG }}
        run: |
          set -euo pipefail
          if [ -n "${NOTES:-}" ]; then
            printf '%s\n' "$NOTES" | tr ';' '\n' \
              | sed -E '/^[[:space:]]*$/d; s/^[[:space:]]*([-*•][[:space:]]*)?/- /' > release_notes.md
          else
            PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
            ./.github/release_notes.sh "${PREV:+$PREV..}HEAD" > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: Finoteku ${{ steps.tag_name.outputs.TAG }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/finoteku-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

