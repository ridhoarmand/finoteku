name: Automated Android Release

# Release = push a tag vX.Y.Z whose X.Y.Z equals `version:` in pubspec.yaml.
# Every check below fails the job instead of shipping a broken or unsigned APK.
# Steps and secrets are documented in CLAUDE.md ("Release").
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # SHA-256 of the release certificate (~/.finoteku-keys/finoteku-release.jks, alias finoteku).
  # Every release must carry it, otherwise it cannot be installed over the previous one.
  RELEASE_CERT_SHA256: 20eac7cd856fbadae61e22bd44064b7fadcc69d55356967e720851df059e29bf

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version, tag and secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for s in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 \
                   ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is missing"; exit 1; }
          done
          TAG=${GITHUB_REF#refs/tags/}
          PUB=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/\r//')
          NAME=${PUB%+*}; BUILD=${PUB#*+}
          [ "v$NAME" = "$TAG" ] || { echo "::error::Tag $TAG does not match pubspec version $NAME"; exit 1; }
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREV" ]; then
            PREV_PUB=$(git show "$PREV:pubspec.yaml" | grep -m1 '^version:' | sed 's/version:[[:space:]]*//; s/\r//')
            PREV_NAME=${PREV_PUB%+*}; PREV_BUILD=${PREV_PUB#*+}
            [ "$(printf '%s\n%s\n' "$PREV_NAME" "$NAME" | sort -V | tail -1)" = "$NAME" ] && [ "$NAME" != "$PREV_NAME" ] \
              || { echo "::error::Version $NAME must be higher than $PREV_NAME ($PREV)"; exit 1; }
            [ "$BUILD" -gt "$PREV_BUILD" ] || { echo "::error::Build number $BUILD must be higher than $PREV_BUILD ($PREV)"; exit 1; }
          fi
          echo "Releasing $NAME+$BUILD (previous: ${PREV:-none})"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # The app reads Supabase credentials at compile time (--dart-define-from-file).
      - name: Create .env and keystore from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --dart-define-from-file=.env
          flutter build apk --release --split-per-abi --dart-define-from-file=.env

      - name: Verify signature and baked-in config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in build/app/outputs/flutter-apk/app-*release.apk; do
            CERT=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            [ "$CERT" = "$RELEASE_CERT_SHA256" ] || { echo "::error::$apk signed with $CERT, expected release cert"; exit 1; }
          done
          unzip -p build/app/outputs/flutter-apk/app-arm64-v8a-release.apk lib/arm64-v8a/libapp.so | grep -qaF "$SUPABASE_URL" \
            || { echo "::error::Supabase URL is not compiled into the APK"; exit 1; }
          echo "All APKs carry the release certificate and the Supabase config."

      - name: Prepare APK Asset Names
        id: tag_name
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk finoteku-${TAG}-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk finoteku-${TAG}-armeabi-v7a.apk
          cp app-x86_64-release.apk finoteku-${TAG}-x86_64.apk
          cp app-release.apk finoteku-${TAG}-universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: Finoteku ${{ steps.tag_name.outputs.TAG }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/finoteku-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

